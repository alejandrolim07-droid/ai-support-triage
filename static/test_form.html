<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Center</title>

  <style>
    :root {
      --navy: #102a43;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --text: #243b53;
      --muted: #627d98;
      --border: #d9e2ec;
      --background: #f0f4f8;
      --success-bg: #e3fcef;
      --success-text: #147d64;
      --error-bg: #ffe3e3;
      --error-text: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #102a43, #243b53 45%, #486581);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 620px;
      overflow: hidden;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(16, 42, 67, 0.28);
    }

    .header {
      padding: 34px 36px 28px;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
    }

    .badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    form {
      padding: 32px 36px 36px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      color: var(--blue);
    }

    input,
    textarea {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.5;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9fb3c8;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    button:disabled {
      background: #9fb3c8;
      cursor: wait;
      transform: none;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    #result.success,
    #result.error {
      display: block;
    }

    #result.success {
      background: var(--success-bg);
      color: var(--success-text);
    }

    #result.error {
      background: var(--error-bg);
      color: var(--error-text);
    }

    .footer {
      padding: 0 36px 28px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }

      .card {
        margin-top: 12px;
        border-radius: 16px;
      }

      .header,
      form {
        padding-left: 22px;
        padding-right: 22px;
      }

      .footer {
        padding-left: 22px;
        padding-right: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <header class="header">
      <span class="badge">Support Center</span>
      <h1>How can we help?</h1>
      <p class="subtitle">
        Send us your request and our support team will review it shortly.
      </p>
    </header>

    <form id="supportForm">
      <div class="field">
        <label for="customer">
          Customer name <span class="required">*</span>
        </label>
        <input
          id="customer"
          name="customer"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
          required
        />
      </div>

      <div class="field">
        <label for="message">
          Support message <span class="required">*</span>
        </label>
        <textarea
          id="message"
          name="message"
          placeholder="Tell us what happened and how we can help..."
          required
        ></textarea>
      </div>

      <button id="submitButton" type="submit">
        Send support request
      </button>

      <div id="result" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">
      Your request will be securely reviewed by our support workflow.
    </div>
  </main>

  <script>
    const form = document.getElementById("supportForm");
    const customerInput = document.getElementById("customer");
    const messageInput = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const result = document.getElementById("result");

    // Replace this with your n8n Production Webhook URL.
    // It should contain /webhook/ and not /webhook-test/.
    const N8N_WEBHOOK_URL = "WEBHOOK";

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      result.className = "";
      result.textContent = "Sending...";
      submitButton.disabled = true;

      const requestBody = {
        id: Date.now(),
        customer: customerInput.value.trim(),
        message: messageInput.value.trim()
      };

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          throw new Error("The request could not be submitted.");
        }

        // The form displays this friendly message instead of the full n8n JSON.
        result.className = "success";
        result.textContent = "Submitted successfully";
        form.reset();
      } catch (error) {
        result.className = "error";
        result.textContent = "Submission failed: " + error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
